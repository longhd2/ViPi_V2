<fieldset id="display-config">
    <legend>Display</legend>

    <label for="display_type">Loại màn hình</label>
    <select id="display_type" name="display_type" onchange="updateDisplayFields()">
        <option value="0">Không sử dụng màn hình</option>
        <option value="1" selected>OLED SSD1306 128x64 I2C</option>
        <option value="2">ST7789 SPI</option>
    </select>

    <div id="display-common">
        <label>Width</label>
        <input name="display_width" type="number" value="128">

        <label>Height</label>
        <input name="display_height" type="number" value="64">

        <label>Rotation</label>
        <select name="display_rotation">
            <option value="0">0</option>
            <option value="90">90</option>
            <option value="180">180</option>
            <option value="270">270</option>
        </select>

        <label>Brightness (%)</label>
        <input name="display_brightness" type="number" min="0" max="100" value="80">

        <label>
            <input name="display_mirror_x" type="checkbox" checked>
            Mirror X
        </label>

        <label>
            <input name="display_mirror_y" type="checkbox" checked>
            Mirror Y
        </label>

        <label>
            <input name="display_invert" type="checkbox">
            Invert color
        </label>
    </div>

    <div id="display-i2c">
        <label>OLED SDA GPIO</label>
        <input name="oled_sda" type="number" value="41">

        <label>OLED SCL GPIO</label>
        <input name="oled_scl" type="number" value="42">

        <label>I2C Address</label>
        <input name="oled_address" type="text" value="0x3C">
    </div>

    <div id="display-spi" style="display:none">
        <label>SPI MOSI GPIO</label>
        <input name="display_mosi" type="number" value="-1">

        <label>SPI CLK GPIO</label>
        <input name="display_clk" type="number" value="-1">

        <label>DC GPIO</label>
        <input name="display_dc" type="number" value="-1">

        <label>RST GPIO</label>
        <input name="display_rst" type="number" value="-1">

        <label>CS GPIO</label>
        <input name="display_cs" type="number" value="-1">

        <label>Backlight GPIO</label>
        <input name="display_backlight" type="number" value="-1">
    </div>

    <button type="button" onclick="testDisplay()">Test Display</button>
</fieldset>

<script>
function updateDisplayFields() {
    const type = Number(document.getElementById("display_type").value);

    document.getElementById("display-common").style.display =
        type === 0 ? "none" : "block";

    document.getElementById("display-i2c").style.display =
        type === 1 ? "block" : "none";

    document.getElementById("display-spi").style.display =
        type === 2 ? "block" : "none";
}

function testDisplay() {
    fetch("/display/test", {
        method: "POST"
    });
}

updateDisplayFields();
</script>
