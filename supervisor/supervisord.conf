[unix_http_server]
file=/home/server/ViPi_V2/supervisor/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/server/ViPi_V2/logs/supervisord.log
pidfile=/home/server/ViPi_V2/supervisor/supervisord.pid
childlogdir=/home/server/ViPi_V2/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/server/ViPi_V2/supervisor/supervisor.sock

[program:vipi-server]
directory=/home/server/ViPi_V2/Server
command=/home/server/onju-v2/env/bin/python -u -m main
user=server
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/server/ViPi_V2/logs/vipi-server.log
stderr_logfile=/home/server/ViPi_V2/logs/vipi-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:vipi-web]
directory=/home/server/ViPi_V2/Server
command=/home/server/onju-v2/env/bin/python -u -m uvicorn web.admin:app --host 0.0.0.0 --port 8090
user=server
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/server/ViPi_V2/logs/vipi-web.log
stderr_logfile=/home/server/ViPi_V2/logs/vipi-web.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
